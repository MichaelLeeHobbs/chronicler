name: Publish

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run build
      # Trusted publishing (OIDC) needs npm 11.5.1 or later
      - run: npm install -g npm@^11.5.1
      - run: npm publish --provenance --access public
      # pnpm pack rewrites the CLI's workspace:* devDependency on the core package;
      # npm publish then uploads the tarball through trusted publishing
      - run: pnpm --filter @ubercode/chronicler-cli pack --pack-destination "$RUNNER_TEMP"
      - run: npm publish "$RUNNER_TEMP"/ubercode-chronicler-cli-*.tgz --provenance --access public
